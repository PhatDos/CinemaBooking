services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinema-booking-api
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: "Server=sqlserver,1433;Database=CinemaBooking;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True"
      ConnectionStrings__Redis: "${REDIS_CONNECTION_STRING}"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "CinemaBooking"
      Jwt__Audience: "CinemaBooking"
      Jwt__ExpirationMinutes: "15"
      AdminSeed__Email: "${ADMIN_EMAIL}"
      AdminSeed__Password: "${ADMIN_PASSWORD}"
      StaffSeed__Email: "staff@cinema.com"
      StaffSeed__Password: "staff12345"
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cinema-booking-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - cinema_sql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQL_PASSWORD}' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  cinema_sql_data:
