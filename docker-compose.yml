services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinema-booking-api
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: "Server=sqlserver,1433;Database=CinemaBooking;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True"
      ConnectionStrings__Redis: "${REDIS_CONNECTION_STRING}"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "CinemaBooking"
      Jwt__Audience: "CinemaBooking"
      Jwt__ExpirationMinutes: "15"
      AdminSeed__Email: "${ADMIN_EMAIL}"
      AdminSeed__Password: "${ADMIN_PASSWORD}"
      StaffSeed__Email: "${STAFF_EMAIL}"
      StaffSeed__Password: "${STAFF_PASSWORD}"
      PayOS__ClientId: "${PAYOS_CLIENT_ID}"
      PayOS__ApiKey: "${PAYOS_API_KEY}"
      PayOS__ChecksumKey: "${PAYOS_CHECKSUM_KEY}"
      PayOS__ReturnUrl: "${PAYOS_RETURN_URL}"
      PayOS__CancelUrl: "${PAYOS_CANCEL_URL}"
      PayOS__ExpirationMinutes: "${PAYOS_EXPIRATION_MINUTES:-15}"
      Cloudinary__CloudName: "${CLOUDINARY_CLOUD_NAME:-}"
      Cloudinary__ApiKey: "${CLOUDINARY_API_KEY:-}"
      Cloudinary__ApiSecret: "${CLOUDINARY_API_SECRET:-}"
      MovieImport__Enabled: "${MOVIE_IMPORT_ENABLED:-false}"
      MovieImport__RunOnDay: "${MOVIE_IMPORT_RUN_ON_DAY:-1}"
      MovieImport__RunAtHour: "${MOVIE_IMPORT_RUN_AT_HOUR:-3}"
      MovieImport__RequestDelayMs: "${MOVIE_IMPORT_REQUEST_DELAY_MS:-1500}"
      MovieImport__MaxMovies: "${MOVIE_IMPORT_MAX_MOVIES:-40}"
      MovieImport__UserAgent: "${MOVIE_IMPORT_USER_AGENT:-CinemaBookingBot/1.0 (+local-dev)}"
      Email__Provider: "${EMAIL_PROVIDER:-Logging}"
      Email__Smtp__Host: "${EMAIL_SMTP_HOST:-}"
      Email__Smtp__Port: "${EMAIL_SMTP_PORT:-587}"
      Email__Smtp__UseStartTls: "${EMAIL_SMTP_USE_START_TLS:-true}"
      Email__Smtp__Username: "${EMAIL_SMTP_USERNAME:-}"
      Email__Smtp__Password: "${EMAIL_SMTP_PASSWORD:-}"
      Email__Smtp__FromEmail: "${EMAIL_SMTP_FROM_EMAIL:-}"
      Email__Smtp__FromName: "${EMAIL_SMTP_FROM_NAME:-Cinema Booking}"
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cinema-booking-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - cinema_sql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQL_PASSWORD}' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  cinema_sql_data:
